name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: campaign_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:secret@localhost:5432/campaign_analytics_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:secret@localhost:5432/campaign_analytics_test?schema=public
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      INGEST_API_KEY: ci-ingest-key-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --target production -t campaign-analytics .
      - name: Build the public demo image
        run: docker build -f Dockerfile.demo -t campaign-analytics-demo .
      - name: Start the stack
        run: docker compose up -d --build
      - name: Check the running app
        run: |
          for attempt in $(seq 1 60); do
            curl -fs http://localhost:3000/health && break
            sleep 2
          done
          curl -fs http://localhost:3000/health
          curl -fs http://localhost:3000/ | grep -q 'id="root"'
          curl -fs -X POST http://localhost:3000/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"advertiser@example.com","password":"advert1234"}' | grep -q token
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
