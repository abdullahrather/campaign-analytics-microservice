# Runs the database and the app with demo data. The dashboard is at http://localhost:3000.
# The default secrets are for local demos only.
services:
  db:
    image: postgres:16-alpine
    container_name: campaign_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: campaign_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: campaign_analytics_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      target: builder
    container_name: campaign_analytics_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:secret@db:5432/campaign_analytics?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-that-is-at-least-32-characters}
      INGEST_API_KEY: ${INGEST_API_KEY:-local-demo-ingest-key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-demo-encryption-key-of-32-characters}
      APP_URL: http://localhost:${PORT:-3000}
      REDIS_URL: redis://redis:6379
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - media_data:/app/.data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts --if-empty && node dist/server.js"

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  redis_data:
    driver: local
