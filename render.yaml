# Public demo on Render's free plan. The database is hosted separately on Neon,
# because Render's free databases expire. Use Neon's direct connection string.
services:
  - type: keyvalue
    name: campaign-analytics-redis
    region: frankfurt
    plan: free
    ipAllowList: []
  - type: web
    name: campaign-analytics-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    region: frankfurt
    plan: free
    healthCheckPath: /live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: campaign-analytics-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DEMO_MODE
        value: 'true'
      - key: SIMULATE_TRAFFIC
        value: on-demand
      - key: TRUST_PROXY
        value: '1'
